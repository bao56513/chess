name: Build Chess V10 APK (8 Elite)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack Project, Fetch Stockfish & Build APK
        run: |
          if [ -f "ChessV10_8Elite_APK_Project.zip" ]; then
            unzip -oq ChessV10_8Elite_APK_Project.zip
          fi
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx4g\n" > gradle.properties
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/libstockfish.so" ]; then
            curl -fL -o sf.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_17/stockfish-android-armv8-dotprod.tar"
            tar -xf sf.tar
            SF_BIN=$(find . -type f -name "stockfish-android-armv8-dotprod" | head -n 1)
            mv "$SF_BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
            chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
          fi
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessV10-8Elite-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
