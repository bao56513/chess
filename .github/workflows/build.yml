name: Build Chess V10 APK (8 Elite)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack, Patch Chaquopy 15, Fetch Stockfish & Build APK
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -oq "$z"
          done

          SETTINGS_FILE=$(find . -maxdepth 5 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Khong tim thay settings.gradle.kts!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n" > gradle.properties
          sed -i 's/package="com.v10.chesselite"//g' app/src/main/AndroidManifest.xml

          python3 -c '
          gradle_kts = """plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.v10.chesselite"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.v10.chesselite"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 10
                  versionName = "10.0-8Elite"

                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.10"
                  buildPython("python3")
                  pip {
                      install("numpy")
                      install("opencv-python-headless")
                      install("chess")
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          """
          open("app/build.gradle.kts", "w").write(gradle_kts)
          '

          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/libstockfish.so" ]; then
            SF_URL=$(curl -sL "https://api.github.com/repos/official-stockfish/Stockfish/releases?per_page=5" | grep -oE 'https://[^"]+android-armv8-dotprod[^"]*\.tar' | head -n 1)
            if [ -z "$SF_URL" ]; then
              SF_URL="https://github.com/official-stockfish/Stockfish/releases/download/sf_17/stockfish-android-armv8-dotprod.tar"
            fi
            curl -fL -o sf.tar "$SF_URL"
            tar -xf sf.tar
            SF_BIN=$(find . -type f -name "*stockfish*armv8*" ! -name "*.tar" | head -n 1)
            mv "$SF_BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
            chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
          fi

          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessV10-8Elite-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
